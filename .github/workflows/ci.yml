name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Biome lint (root + workspaces)
        run: bun run lint
      # `bun run lint` resolves to `bun run --filter '*' lint` which executes
      # `biome check src/` per workspace (backend + app). No ESLint, no
      # Prettier — Biome 2.5 is the single source of truth for lint+format.
      - name: Biome format check (CI mode, no writes)
        run: bunx @biomejs/biome ci .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Typecheck backend
        run: cd backend && bunx tsc --noEmit
      - name: Typecheck frontend
        run: cd app && bunx svelte-kit sync && bunx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      # Vitest is the unit-test runner (F2 from Phase 11). `bun test` is still
      # used for the E2E suite only (see the e2e job below). Coverage is
      # uploaded as an artifact on every run (including failures).
      - name: Vitest (backend)
        run: cd backend && bunx vitest run --coverage
      - name: Vitest (frontend)
        run: cd app && bunx vitest run --coverage
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/coverage/**
            **/test-results/**

  e2e:
    name: E2E (skipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: E2E tests (skipped in CI — requires dev server)
        run: cd app && HIAI_POST_E2E_SKIP=1 bun test tests/e2e/
        # E2E tests are skipped via HIAI_POST_E2E_SKIP=1 in CI because they
        # require a running dev server. This step verifies the test files
        # are syntactically valid and the skip mechanism works.

  migration-check:
    name: Migration integrity
    runs-on: ubuntu-latest
    services:
      # Fresh, empty PostgreSQL for the check. Plain postgres is sufficient for
      # the current schema (no pgvector columns); if a migration starts using
      # pgvector, switch this to pgvector/pgvector:pg18 to mirror docker-compose.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hiai_post_check
          POSTGRES_USER: hipost
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hipost -d hiai_post_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Migration integrity check
        # backend/scripts/migration-check.ts applies migrations 0000..current on
        # the empty service DB, verifies core tables (tenant_members, Better
        # Auth tables, content_items, api_keys) and detects schema/migration
        # drift. It writes nothing into the repository.
        env:
          DATABASE_URL: postgresql://hipost:changeme@localhost:5432/hiai_post_check
        run: cd backend && bun run db:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Build backend
        run: cd backend && bun run build
      - name: Build frontend
        run: cd app && bun run build
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: app/build/

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      # Hard gate: any reachable critical/high advisory fails CI. `bun audit
      # --audit-level=high` prints advisories with severity >= high and exits
      # non-zero when any are present. After the 2026-08-13 remediation the
      # tree is clean at this level (0 critical, 0 high). If this starts
      # failing, fix the advisory — do not add continue-on-error.
      - name: Audit (fail on critical/high)
        run: bun audit --audit-level=high
      # Full audit report: always runs and the full output is always visible
      # in job logs so low/moderate findings are never silently swallowed.
      # The `|| true` is intentional and bounded: it only permits the KNOWN
      # residuals documented in docs/SECURITY-REMEDIATION-2026-08-13.md
      # (currently 3, all below high: esbuild 0.18.20 via drizzle-kit's
      # @esbuild-kit loader — moderate; cookie 0.6.0 via @sveltejs/kit — low;
      # @ai-sdk/provider-utils <=3.0.97 via @mastra/core — low). Any NEW
      # advisory at any level still shows up here; high/critical additionally
      # fail the gate above.
      - name: Audit (full report, visible)
        run: bun audit || true
